<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3c8f">
<title>Судьба правителей • История и котики</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3c8f;--navy2:#162c6b;--navy3:#2b4fb3;--or:#f0861f;--or2:#ffb15c;--orl:#fff1e2;--pur:#7a4fc4;--paper:#fbf4e8;--line:#f0dcc1;--ink:#1f2a52;--mut:#6d7799;--ok:#2f8a63;--bad:#c9661a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);min-height:100vh;display:flex;flex-direction:column;align-items:center}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:Comfortaa,Nunito,sans-serif;margin:0}
header{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:800;line-height:1.05;font-size:14px;letter-spacing:.5px}
.brand img{width:42px;height:42px;border-radius:50%;mix-blend-mode:multiply}
.top-actions{display:flex;gap:8px}
.chip{border:2px solid var(--navy);background:#fff;border-radius:30px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--navy)}
.chip:hover{background:var(--orl)}
/* stage */
.stage{width:min(560px,calc(100% - 24px));background:var(--navy);border-radius:28px;box-shadow:6px 8px 0 var(--or);padding:16px 16px 18px;color:#fff;position:relative;margin:4px 0 28px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--navy2);border-radius:18px;padding:10px 8px}
.meter{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.meter svg{width:40px;height:40px}
.meter span{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.meter .dot{position:absolute;top:-4px;right:calc(50% - 26px);width:9px;height:9px;border-radius:50%;background:var(--or2);opacity:0;transform:scale(.4);transition:.2s}
.meter .dot.show{opacity:1;transform:scale(1)}.meter .dot.big{width:13px;height:13px;top:-6px}
.meter .fillrect{transition:y .6s,height .6s}
.timeline{margin:12px 4px 6px;position:relative;height:34px}
.tl-bar{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:4px;background:var(--navy2);overflow:hidden}
.tl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or2),var(--or));transition:width .6s}
.tl-years{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:space-between;font-size:10px;opacity:.75;font-weight:700}
.tl-era{position:absolute;top:3px;width:2px;height:18px;background:#ffffff55}
.era-name{text-align:center;font-family:Comfortaa;font-weight:700;font-size:15px;margin:4px 0 10px}
.era-name small{display:block;font-family:Nunito;font-size:11px;font-weight:800;color:var(--or2);letter-spacing:1.5px;text-transform:uppercase}
/* card */
.deck{position:relative;height:430px;perspective:1200px;touch-action:pan-y}
.card{position:absolute;inset:0;margin:auto;width:100%;max-width:400px;height:420px;border-radius:24px;background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);color:var(--ink);box-shadow:0 10px 0 #0e1d4a55;transition:transform .35s cubic-bezier(.2,.8,.3,1.2),opacity .3s;cursor:grab;user-select:none;display:flex;flex-direction:column;overflow:hidden;border:3px solid #fff}
.card.dragging{transition:none;cursor:grabbing}
.card.under{transform:scale(.94) translateY(14px);opacity:.6;pointer-events:none;filter:brightness(.92)}
.card .yr{position:absolute;top:12px;left:14px;background:var(--navy);color:#fff;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:800}
.card .pg{position:absolute;top:13px;right:14px;font-size:11px;color:var(--mut);font-weight:700}
.portrait{height:170px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 70%,#fff1e2 0 45%,transparent 46%);flex-shrink:0;padding-top:24px}
.portrait svg{height:150px}
.who{text-align:center;margin-top:2px}.who b{font-family:Comfortaa;font-size:17px;color:var(--navy)}.who span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.say{margin:10px 18px 0;font-size:16.5px;line-height:1.4;font-weight:700;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.hint-l,.hint-r{position:absolute;top:60px;max-width:46%;padding:8px 12px;border-radius:14px;font-weight:800;font-size:14px;line-height:1.2;opacity:0;transition:opacity .15s;background:var(--navy);color:#fff;pointer-events:none}
.hint-l{left:12px;transform:rotate(-6deg)}.hint-r{right:12px;transform:rotate(6deg);background:var(--or)}
.card .result{padding:22px 22px 14px;display:flex;flex-direction:column;height:100%}
.verdict{font-family:Comfortaa;font-size:22px;font-weight:700;margin:10px 0 6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.result p{font-size:15.5px;line-height:1.45;margin:6px 0;font-weight:600}
.result .eff{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.eff span{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;background:#e9eefb;color:var(--navy)}.eff span.m{background:var(--orl);color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{border:0;border-radius:16px;padding:12px 10px;font-weight:800;font-size:14.5px;line-height:1.2;min-height:56px;background:#fff;color:var(--navy);box-shadow:0 4px 0 #0e1d4a;transition:transform .1s}
.choice.r{background:var(--or);color:#fff;box-shadow:0 4px 0 #b25e10}
.choice:active{transform:translateY(3px);box-shadow:none}
.choice small{display:block;font-size:10.5px;opacity:.7;font-weight:800;letter-spacing:.5px;margin-bottom:2px}
.next{grid-column:1/-1;background:var(--or);color:#fff;box-shadow:0 4px 0 #b25e10}
.candles{display:flex;justify-content:center;gap:10px;margin-top:14px}
.candles svg{width:20px;height:34px}.candles .out{opacity:.25}
.score{text-align:center;font-size:12px;font-weight:800;opacity:.8;margin-top:6px;letter-spacing:.5px}
/* special cards */
.special{padding:26px 24px;text-align:center;justify-content:center;gap:8px}
.special h2{font-size:26px;color:var(--navy);line-height:1.2}
.special .kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--or)}
.special p{font-size:15.5px;font-weight:600;line-height:1.45;margin:4px 0}
.ledger{display:grid;gap:6px;text-align:left;margin-top:6px}
.ledger div{font-size:13.5px;font-weight:700;background:#fff;border-radius:12px;padding:8px 11px;border-left:5px solid var(--ok)}
.ledger div.b{border-left-color:var(--or)}
.seal{width:92px;height:92px;border-radius:50%;border:3px double var(--or);color:var(--or);display:flex;align-items:center;justify-content:center;font-family:Comfortaa;font-weight:700;font-size:13px;transform:rotate(-10deg);margin:0 auto 4px;line-height:1.15}
.tree{display:grid;gap:7px;text-align:left;margin-top:6px}
.tree div{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:6px 8px;font-size:12.5px;font-weight:700}
.tree svg{width:44px;height:44px}.tree b{color:var(--navy);display:block;font-size:13.5px}
dialog{border:3px solid var(--navy);border-radius:22px;max-width:560px;width:calc(100% - 28px);padding:22px;background:var(--paper);color:var(--ink);box-shadow:6px 8px 0 var(--or)}
dialog::backdrop{background:#0e1d4acc}
dialog h2{color:var(--navy);font-size:20px;margin-bottom:10px}dialog p,dialog li{font-size:14.5px;line-height:1.5;font-weight:600}
dialog .close{float:right;border:0;background:none;font-size:22px;color:var(--navy)}
.foot{font-size:11.5px;color:var(--mut);font-weight:700;text-align:center;padding:0 16px 24px;max-width:560px}
@media(max-width:480px){.deck{height:400px}.card{height:392px}.portrait{height:150px}.portrait svg{height:130px}.say{font-size:15.5px}.stage{padding:12px 10px 14px;border-radius:22px}.meter svg{width:34px;height:34px}.brand span{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<script>
const ERAS=[{"id": "elena", "ruler": "Елена Глинская", "years": "1533–1538", "costume": "queen", "intro": "Василий III умер. Наследнику Ивану три года. Двор ждёт: кто возьмёт власть?", "cards": [{"year": "1533", "who": "Митрополит Даниил", "role": "глава церкви", "costume": "metropolitan", "text": "«Государыня, покойный велел управлять опекунскому совету из семи бояр. Отдашь ли им власть?»", "L": "Отдать власть совету", "R": "Править самой", "ok": "R", "after": "Регентом стала Елена Глинская. Править ей помогали фаворит И. Ф. Овчина-Телепнев-Оболенский и митрополит Даниил.", "eff": {"k": 0, "v": 0, "c": 1, "n": 0}, "page": 2}, {"year": "1535", "who": "Казначей", "role": "дьяк Казённого двора", "costume": "clerk", "text": "«Монеты разного веса, торговля путается. Не ввести ли одну монету — копейку, а сто копеек считать рублём?»", "L": "Оставить как есть", "R": "Провести реформу", "ok": "R", "after": "Денежная реформа 1535 г.: копейка, деньга, полушка, 100 копеек = 1 рубль; единые меры длины и объёма. Экономическое единство страны окрепло.", "eff": {"k": 2, "v": 0, "c": 0, "n": 1}, "page": 2}, {"year": "1530-е", "who": "Губной староста", "role": "выборный служилый человек", "costume": "noble", "text": "«Разбойники хозяйничают, а кормленщики только берут мзду. Дозволь нам, выборным из местных служилых людей, судить разбойные дела».", "L": "Дозволить", "R": "Отказать", "ok": "L", "after": "Так началась губная реформа: губные старосты вели дела о разбое, произвол кормленщиков сократился.", "eff": {"k": 0, "v": 0, "c": 0, "n": 1}, "page": 2}, {"year": "1530-е", "who": "Петрок Малый", "role": "итальянский зодчий", "costume": "architect", "text": "«Посад у Кремля беззащитен. Позволь возвести новую крепость с двенадцатью башнями».", "L": "Строить Китай-город", "R": "Не тратить казну", "ok": "L", "after": "Петрок Малый построил стены Китай-города. Появились и новые крепости: Себеж, Заволочье, Проник, Балахна.", "eff": {"k": -1, "v": 1, "c": 0, "n": 0}, "page": 3}, {"year": "1537", "who": "Овчина-Телепнев-Оболенский", "role": "фаворит правительницы", "costume": "boyar", "text": "«Андрей Старицкий поднимает Новгород против тебя. Прикажешь схватить князя?»", "L": "Схватить", "R": "Простить и отпустить", "ok": "L", "after": "Андрей Старицкий не нашёл сторонников и погиб в заточении; ранее в тюрьме уморили Юрия Дмитровского. Расправы вызвали недовольство Глинскими.", "eff": {"k": 0, "v": 0, "c": -1, "n": -1}, "page": 3}, {"year": "1537", "who": "Воевода", "role": "с литовской границы", "costume": "voevoda", "text": "«Литва и Польша воюют с нами уже три года. Мириться на прежней границе или воевать дальше за новые земли?»", "L": "Воевать дальше", "R": "Перемирие", "ok": "R", "after": "Война 1534–1537 гг. закончилась перемирием на прежней границе. Внешняя политика Елены была в целом успешной.", "eff": {"k": 1, "v": 0, "c": 0, "n": 1}, "page": 3}], "fate": {"title": "Апрель 1538. Смерть регентши", "text": "Елена Глинская умирает. Восьмилетний Иван остаётся сиротой, а бояре начинают борьбу за власть.", "good": "денежная реформа, начало губной реформы", "bad": "расправы, нелюбовь к «литовке» и к Глинским"}}, {"id": "boyars", "ruler": "Юный Иван IV", "years": "1538–1547", "costume": "prince", "intro": "При дворе хозяйничают бояре. Мальчик-государь всё видит и всё запоминает.", "cards": [{"year": "1538", "who": "Князь Шуйский", "role": "боярин", "costume": "boyar", "text": "«Регентши больше нет. Теперь страной будут править знатные роды — Шуйские, Бельские, Глинские. Согласен, государь?»", "L": "Согласиться", "R": "Запретить", "ok": "L", "after": "Иван был ребёнком и не мог помешать: за власть боролись Шуйские, Бельские и Глинские. Бояре даже отстранили двух митрополитов.", "eff": {"k": -1, "v": 0, "c": -1, "n": -1}, "page": 4}, {"year": "1540-е", "who": "Посадский человек", "role": "житель Москвы", "costume": "townsman", "text": "«Кормленщики грабят, казну расхищают, по городам мятежи. Будут ли бояре чинить реформы?»", "L": "Да, начнут реформы", "R": "Нет, им не до того", "ok": "R", "after": "Бояре занимались распрями: положение народа ухудшилось, власть ослабла, росли противоречия между боярством и служилыми людьми.", "eff": {"k": -2, "v": -1, "c": 0, "n": -2}, "page": 4}, {"year": "1547", "who": "Митрополит Макарий", "role": "глава церкви", "costume": "metropolitan", "text": "«Пора тебе, государь, венчаться на царство в Успенском соборе. Примешь ли титул царя?»", "L": "Принять", "R": "Остаться великим князем", "ok": "L", "after": "16 января 1547 г. Иван IV венчался на царство. Титул «царь» ставил его вровень с императорами и ханами Орды и укреплял идею «Москва — Третий Рим».", "eff": {"k": 0, "v": 0, "c": 2, "n": 1}, "page": 4}, {"year": "1547", "who": "Сваха", "role": "при дворе", "costume": "townswoman", "text": "«Невесту выбрали: Анастасия Романовна Захарьина-Юрьева. Играть свадьбу в феврале?»", "L": "Играть свадьбу", "R": "Ждать другую невесту", "ok": "L", "after": "В феврале 1547 г. Иван женился на Анастасии Романовне Захарьиной-Юрьевой.", "eff": {"k": 0, "v": 0, "c": 1, "n": 1}, "page": 4}, {"year": "июнь 1547", "who": "Протопоп Сильвестр", "role": "Благовещенский собор", "costume": "priest", "text": "«Москва сгорела, народ громит Глинских. Если не возьмёшь власть сам, будешь гореть в аду, как горит твоя столица!»", "L": "Взять власть в свои руки", "R": "Уехать из Москвы", "ok": "L", "after": "После пожара и бунта, когда толпа забила камнями Юрия Глинского, царь понял: нужны реформы. Рядом с ним появилась Избранная рада.", "eff": {"k": -1, "v": 0, "c": 1, "n": -1}, "page": 5}], "fate": {"title": "1547. Царь готов править", "text": "Иван IV венчан на царство и женат. Годы сиротства сделали его подозрительным — это ещё скажется.", "good": "венчание на царство, осознание нужды в реформах", "bad": "разорённая казна, мятежи, жестокость юного царя"}}, {"id": "rada", "ruler": "Иван IV и Избранная рада", "years": "1549–1560", "costume": "tsar", "intro": "Рядом с царём — Сильвестр, Адашев, Курбский, Макарий. Время больших реформ и походов на восток.", "cards": [{"year": "1549", "who": "Алексей Адашев", "role": "глава Избранной рады", "costume": "noble", "text": "«Созовём собор из бояр, духовенства и выборных служилых людей — пусть все сословия примирятся».", "L": "Созвать Земский собор", "R": "Решать всё одному", "ok": "L", "after": "Первый Земский собор 1549 г. — «Собор примирения». Он одобрил составление нового законодательства.", "eff": {"k": 0, "v": 0, "c": 1, "n": 1}, "page": 6}, {"year": "1550", "who": "Алексей Адашев", "role": "глава Избранной рады", "costume": "noble", "text": "«Новый Судебник готов. Отменим Юрьев день или оставим крестьянам право перехода?»", "L": "Отменить Юрьев день", "R": "Подтвердить Юрьев день", "ok": "R", "after": "Судебник 1550 г. подтвердил Юрьев день, но увеличил пожилое; ограничил власть наместников, наказывал за взятки.", "eff": {"k": 1, "v": 0, "c": 0, "n": 1}, "page": 7}, {"year": "1550", "who": "Голова стрельцов", "role": "пищальник", "costume": "strelets", "text": "«Нужно постоянное войско с пищалями — в мирное время будем нести караул и торговать».", "L": "Создать стрелецкое войско", "R": "Обойтись ополчением", "ok": "L", "after": "В 1550 г. появилось стрелецкое войско. Стрельцы совмещали службу с ремеслом и торговлей, ими ведал Стрелецкий приказ.", "eff": {"k": -1, "v": 2, "c": 0, "n": 0}, "page": 9}, {"year": "1552", "who": "Иван Выродков", "role": "дьяк-строитель", "costume": "architect", "text": "«Срубим крепость Свияжск у самой Казани, а к стенам подведём подкопы с порохом».", "L": "Штурмовать Казань", "R": "Заключить мир с ханом", "ok": "L", "after": "Свияжск возвели за 28 дней. 2 октября 1552 г. после подрывов Казань взята штурмом, ханство вошло в состав России.", "eff": {"k": 1, "v": 1, "c": 1, "n": 0}, "page": 11}, {"year": "1556", "who": "Ногайский князь Исмаил", "role": "союзник Москвы", "costume": "nomad", "text": "«Астраханский хан Дервиш-Али сговорился с Крымом и выгнал твоего человека. Пошлёшь войско?»", "L": "Пос  return ending();
}
function title(){setCard(`<div class="special" style="display:flex;flex-direction:column;height:100%"><div class="portrait" style="background:none;padding:0">${cat('tsar')}</div><span class="kicker">Игра-летопись · 1533–1598</span><h2>Судьба правителей</h2><p>Ты — кот-советник при московском дворе. Тебе приносят прошения и вести, а ты решаешь: <b>влево</b> или <b>вправо</b>. Угадай, как было на самом деле, — и история пойдёт своим путём.</p></div>`);
 setButtons(`<button class="choice next" id="go">Войти в тронный зал</button>`);$('#go').onclick=()=>advance()}
function intro(ei){const e=ERAS[ei];S.eraStart={pos:S.pos,m:{...S.m},right:S.right,answers:{...S.answers}};save();
 setCard(`<div class="special" style="display:flex;flex-direction:column;height:100%"><div class="portrait" style="background:none;padding:0">${cat(e.costume)}</div><span class="kicker">Глава ${ei+1} из ${ERAS.length} · ${e.years}</span><h2>${esc(e.ruler)}</h2><p>${esc(e.intro)}</p></div>`);
 setButtons(`<button class="choice next" id="go">Начать правление</button>`);$('#go').onclick=()=>advance()}
function ask(ei,ci){const c=ERAS[ei].cards[ci];
 setCard(`<span class="yr">${esc(c.year)}</span><span class="pg">${ci+1}/${ERAS[ei].cards.length}</span><div class="portrait">${cat(c.costume)}</div><div class="who"><b>${esc(c.who)}</b><span>${esc(c.role)}</span></div><div class="say">${esc(c.text)}</div><div class="hint-l" id="hl">${esc(c.L)}</div><div class="hint-r" id="hr">${esc(c.R)}</div><div style="height:14px"></div>`);
 setButtons(`<button class="choice" data-side="L"><small>← ВЛЕВО</small>${esc(c.L)}</button><button class="choice r" data-side="R"><small>ВПРАВО →</small>${esc(c.R)}</button>`);
 document.querySelectorAll('[data-side]').forEach(b=>{b.onclick=()=>choose(b.dataset.side,true);b.onmouseenter=()=>renderMeters(c.eff);b.onmouseleave=()=>renderMeters()});
 drag(c);
}
function choose(side,fly){if(phase!=='ask')return;phase='result';const st=STEPS[S.pos];const c=ERAS[st.ei].cards[st.ci];const ok=side===c.ok;
 const card=$('#card');if(fly&&card){card.style.transform=`translateX(${side==='L'?-140:140}%) rotate(${side==='L'?-24:24}deg)`;card.style.opacity='0'}
 setTimeout(()=>{
  for(const k in c.eff)S.m[k]=Math.max(0,Math.min(10,S.m[k]+c.eff[k]));
  S.answers[S.pos]=ok;if(ok)S.right++;else S.candles--;save();
  const effs=MET.filter(([k])=>c.eff[k]).map(([k,l])=>`<span class="${c.eff[k]<0?'m':''}">${l} ${c.eff[k]>0?'+':''}${c.eff[k]}</span>`).join('');
  setCard(`<div class="result"><span class="yr">${esc(c.year)}</span><div class="verdict ${ok?'ok':'bad'}">${ok?'Так и было!':'История пошла иначе…'}</div>
   ${ok?'':`<p style="color:var(--mut)">Ты выбрал «${esc(side==='L'?c.L:c.R)}». На самом деле — «${esc(c.ok==='L'?c.L:c.R)}».</p>`}
   <p>${esc(c.after)}</p><div class="eff">${effs}<span style="background:none;color:var(--mut)">стр. PDF ${c.page}</span></div></div>`);
  hud();
  document.getElementById('sr').textContent=(ok?'Верно. ':'Неверно. ')+c.after;
  if(S.candles<=0)return opala();
  setButtons(`<button class="choice next" id="go">Дальше</button>`);$('#go').onclick=()=>advance();$('#go').focus();
 },fly?260:0)}
function fate(ei){const e=ERAS[ei],f=e.fate;const n=e.cards.length;const r=e.cards.filter((_,ci)=>S.answers[STEPS.findIndex(s=>s.t==='card'&&s.ei===ei&&s.ci===ci)]).length;
 setCard(`<div class="special" style="display:flex;flex-direction:column;height:100%"><div class="seal">СУДЬБА<br>РАСКРЫТА</div><h2>${esc(f.title)}</h2><p>${esc(f.text)}</p><div class="ledger"><div>Наследие: ${esc(f.good)}</div><div class="b">Цена: ${esc(f.bad)}</div></div><p style="font-size:13px;color:var(--mut)">В этой главе ты угадал ${r} из ${n}</p></div>`);
 setButtons(`<button class="choice next" id="go">${ei+1<ERAS.length?'Следующее правление':'Открыть летопись'}</button>`);$('#go').onclick=()=>advance()}
function rank(){const p=S.right/TOTAL;return p>=.95?['Летописец-хранитель','ни одно событие не ускользнуло']:p>=.8?['Мудрый советник','почти безупречная служба']:p>=.6?['Думный дьяк','крепкая память, но есть пробелы']:['Юный писарь','летопись стоит перечитать']}
function ending(){const [t,d]=rank();
 setCard(`<div class="special" style="display:flex;flex-direction:column;height:100%;overflow:auto"><span class="kicker">Летопись века</span><h2>${t}</h2><p>Как было: <b>${S.right} из ${TOTAL}</b> — ${d}.</p><div class="tree">${ERAS.map(e=>`<div>${cat(e.costume)}<span><b>${esc(e.ruler)} · ${e.years}</b>${esc(e.fate.title)}</span></div>`).join('')}</div></div>`);
 setButtons(`<button class="choice" id="print">Сохранить / печать</button><button class="choice r" id="again">Сыграть ещё раз</button>`);
 $('#print').onclick=()=>window.print();$('#again').onclick=()=>{S=fresh();save();show()}}
function opala(){setCard(`<div class="special" style="display:flex;flex-direction:column;height:100%"><div class="portrait" style="background:none;padding:0">${cat('oprichnik')}</div><span class="kicker">Свечи догорели</span><h2>Опала!</h2><p>Слишком много раз история пошла иначе. Советника отправили в дальний монастырь… Но можно вернуться ко двору — с начала этой главы.</p></div>`);
 setButtons(`<button class="choice next" id="go">Начать главу заново</button>`);
 $('#go').onclick=()=>{const es=S.eraStart;S.pos=es.pos;S.m={...es.m};S.right=es.right;S.answers={...(es.answers||{})};S.candles=5;save();show()}}
function advance(){S.pos=Math.min(STEPS.length-1,S.pos+1);save();show()}
/* ---- drag ---- */
function drag(c){const card=$('#card');let x0=null,dx=0;const hl=$('#hl'),hr=$('#hr');
 const move=x=>{dx=x-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;const t=Math.min(1,Math.abs(dx)/90);hl.style.opacity=dx<0?t:0;hr.style.opacity=dx>0?t:0;renderMeters(Math.abs(dx)>30?c.eff:null)};
 card.addEventListener('pointerdown',e=>{if(phase!=='ask')return;x0=e.clientX;card.classList.add('dragging');card.setPointerCapture(e.pointerId)});
 card.addEventListener('pointermove',e=>{if(x0!==null)move(e.clientX)});
 const up=()=>{if(x0===null)return;card.classList.remove('dragging');x0=null;if(Math.abs(dx)>110){choose(dx<0?'L':'R',true)}else{card.style.transform='';hl.style.opacity=hr.style.opacity=0;renderMeters()}dx=0};
 card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up)}
document.addEventListener('keydown',e=>{if($('#dlg').open)return;const st=STEPS[S.pos];
 if(phase==='ask'&&st&&st.t==='card'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){choose(e.key==='ArrowLeft'?'L':'R',true)}
 else if((e.key==='Enter'||e.key===' '||e.key==='ArrowRight')&&$('#go')&&document.activeElement!==$('#go')){e.preventDefault();$('#go').click()}});
/* ---- dialogs ---- */
function dlg(html){$('#dlgbody').innerHTML=html;$('#dlg').showModal()}
$('#dlgx').onclick=()=>$('#dlg').close();
$('#help').onclick=()=>dlg(`<h2>Как играть</h2><ul><li>К тебе по очереди приходят бояре, митрополиты, воеводы и купцы с прошениями.</li><li>Свайпни карточку <b>влево</b> или <b>вправо</b> (или нажми кнопку, или стрелку на клавиатуре). Выбирай то, что произошло на самом деле.</li><li>Шкалы <b>Казна, Войско, Церковь, Народ</b> показывают последствия решений — так, как это было в истории. Точки над шкалами подсказывают, какие из них изменятся.</li><li>За каждую ошибку гаснет свеча. Погасли все пять — опала, глава начинается заново.</li><li>В конце каждой главы — судьба правителя, в финале — летопись века и твоё звание.</li></ul><p style="font-size:12.5px;color:var(--mut)">Кот-советник и прошения вымышлены, но все факты взяты из скрипта «Иван Грозный» — у каждого ответа указана страница PDF. Прогресс хранится только в этом браузере.</p>`);
$('#restart').onclick=()=>dlg(`<h2>Начать заново?</h2><p>Вся летопись в этом браузере будет сброшена.</p><button class="choice r" style="width:100%;margin-top:10px" id="yes">Да, с чистого листа</button>`)||($('#yes').onclick=()=>{S=fresh();save();$('#dlg').close();show()});
$('#brand').onclick=e=>{e.preventDefault()};
show();
</script></body></html>
