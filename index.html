<script>
const DATA={"chapters": [{"id": "elena", "title": "Мать-регентша", "ruler": "Елена Глинская", "years": "1533–1538", "icon": "👑", "intro": "Я — Квакс, советник при государевом дворе. Василий III умер, а наследнику всего три года. Поможешь вспомнить, как правила его мать и что стало с её судьбой?", "notes": ["1533 г. — смерть Василия III; наследник Иван — трёхлетний ребёнок. Создан опекунский совет из 7 бояр, но регентом стала мать — Елена Глинская.", "Елена правила вместе с фаворитом И. Ф. Овчиной-Телепневым-Оболенским и митрополитом Даниилом.", "1535 г. — денежная реформа: единая монетная система, копейка (100 копеек = 1 рубль), единые меры длины и объёма.", "Начало губной реформы: губные старосты — выборные из местных служилых людей, ведали делами о разбое.", "Построен Китай-город (12 башен, архитектор Петрок Малый), новые крепости Себеж, Заволочье, Проник, Балахна.", "1534–1537 гг. — война с Литвой и Польшей, перемирие на прежней границе. Удельные князья Юрий Дмитровский и Андрей Старицкий погибли в заточении."], "decisions": [{"year": "1533", "title": "Кому править?", "situation": "Василий III умер, на престоле трёхлетний Иван. По воле покойного создан опекунский совет из семи бояр. Кто на деле взял власть в свои руки?", "options": ["Брат покойного, удельный князь Юрий Дмитровский", "Вдова, Елена Глинская, ставшая регентшей", "Опекунский совет, правивший без государыни"], "answer": 1, "ex": "Регентом стала Елена Глинская. Она правила вместе с фаворитом И. Ф. Овчиной-Телепневым-Оболенским и митрополитом Даниилом.", "eff": {"k": 0, "v": 0, "z": -1, "n": 0}, "page": 2}, {"year": "1535", "title": "Монеты разного веса", "situation": "В стране ходят монеты разного веса, монетные дворы чеканят их по-разному. Это мешает торговле и сбору податей. Какое решение принимает правительство?", "options": ["Провести денежную реформу: единая монетная система, копейка, 100 копеек = 1 рубль", "Перейти на бумажные деньги", "Запретить торговлю серебром и вернуться к меновой торговле"], "answer": 0, "ex": "Денежная реформа 1535 г. ввела единую монетную систему: копейка, деньга (½ копейки), полушка (¼). Введены и единые меры длины и объёма — это укрепило экономическое единство страны.", "eff": {"k": 2, "v": 0, "z": 0, "n": 1}, "page": 2}, {"year": "1530-е", "title": "Разбойники и кормленщики", "situation": "На местах растёт разбой, а наместники-кормленщики творят произвол. Кому правительство поручает рассматривать дела о разбое?", "options": ["Губным старостам — выборным из местных служилых людей", "Стрелецким головам", "Самим наместникам-кормленщикам с удвоенными правами"], "answer": 0, "ex": "Началась губная реформа: губные старосты избирались из местных служилых людей и вели дела о разбое. Произвол кормленщиков сократился — так был подготовлен фундамент реформы местного управления при Иване IV.", "eff": {"k": 0, "v": 0, "z": 0, "n": 1}, "page": 2}, {"year": "1530-е", "title": "Укрепить столицу", "situation": "Москве нужна новая защита. Что было построено в годы регентства Елены Глинской?", "options": ["Белый город с каменными стенами", "Китай-город — крепость с 12 башнями (архитектор Петрок Малый)", "Новый Кремль из белого камня"], "answer": 1, "ex": "Итальянский архитектор Петрок Малый возвёл крепость Китай-города с 12 башнями. Строились и новые города-крепости: Себеж, Заволочье, Проник, Балахна. Белый город появится позже — при Фёдоре Иоанновиче.", "eff": {"k": -1, "v": 1, "z": 0, "n": 0}, "page": 3}, {"year": "1534–1537", "title": "Война на западе", "situation": "Литва и Польша начали войну, надеясь воспользоваться малолетством государя. Чем она закончилась?", "options": ["Россия получила выход к Балтийскому морю", "Россия потеряла Смоленск", "Перемирием с сохранением прежней границы"], "answer": 2, "ex": "Война 1534–1537 гг. завершилась перемирием на прежней границе. Внешняя политика Елены была в целом успешной: мир с Ливонией, дружба с Молдавией, Швецией, Астраханью и Ногайской ордой.", "eff": {"k": -1, "v": 0, "z": 0, "n": 0}, "page": 3}, {"year": "1537", "title": "Опасные дяди", "situation": "Удельные князья — братья Василия III — могли претендовать на власть. Как поступила с ними Елена Глинская?", "options": ["Заключила их в заточение, где оба погибли", "Отдала им Новгород в управление", "Отправила послами в Литву"], "answer": 0, "ex": "Юрия Дмитровского уморили голодом в тюрьме. Андрей Старицкий попытался поднять Новгород, не нашёл сторонников и погиб в заточении; удел Старицких ликвидирован. Расправы вызвали недовольство родом Глинских.", "eff": {"k": 0, "v": 0, "z": -2, "n": 0}, "page": 3}], "fate": {"title": "Апрель 1538 г. Смерть регентши", "text": "Елена Глинская умирает, и восьмилетний Иван остаётся «круглым сиротой». Её «литовку» в обществе не любили, а расправы ударили по роду Глинских. Начинается борьба боярских родов за власть.", "plus": ["Денежная реформа укрепила экономическое единство страны", "Начата губная реформа — фундамент реформ Ивана IV", "Повысился международный авторитет"], "minus": ["Расправы вызвали недовольство Глинскими и повлияли на характер будущего царя", "Елене приписывают «первенство» в приобщении фаворитов к власти"]}}, {"id": "boyars", "title": "Сирота на троне", "ruler": "Боярское правление", "years": "1538–1547", "icon": "⚔", "intro": "Регентши больше нет. Бояре делят власть, а юный Иван смотрит на это и запоминает. Разберёмся, к чему привели боярские распри и как Иван стал царём.", "notes": ["1538 г. — смерть Елены Глинской; борьба за власть между Шуйскими, Бельскими и Глинскими.", "Бояре занимались распрями, а не реформами: произвол кормленщиков, расхищение казны, волнения в городах.", "Иван IV вспоминал, что остался «круглым сиротой»; жестокие казни на его глазах сформировали подозрительность и мстительность.", "16 января 1547 г. — венчание Ивана IV на царство в Успенском соборе (предложил митрополит Макарий).", "Февраль 1547 г. — женитьба на Анастасии Романовне Захарьиной-Юрьевой.", "Июнь 1547 г. — большой пожар в Москве, бунт против Глинских; протопоп Сильвестр убеждает царя взять власть."], "decisions": [{"year": "1538", "title": "Кто у власти?", "situation": "После смерти Елены Глинской придворные роды начали борьбу за власть. Какие три рода боролись между собой?", "options": ["Романовы, Годуновы и Старицкие", "Шуйские, Бельские и Глинские", "Адашевы, Курбские и Воротынские"], "answer": 1, "ex": "Власть оспаривали Шуйские, Бельские и Глинские. Два митрополита за это время были отстранены боярами.", "eff": {"k": -1, "v": 0, "z": 1, "n": -1}, "page": 4}, {"year": "1540-е", "title": "Что видит страна?", "situation": "Каким стало положение страны в годы боярского правления?", "options": ["Бояре продолжили реформы, казна наполнилась", "Усилился произвол кормленщиков, расхищалась казна, начались волнения в городах", "Народ получил право избирать наместников"], "answer": 1, "ex": "Бояре занимались личными распрями: ухудшилось положение народа, ослабла центральная власть, расхищалась казна, начались выступления в городах. Росли противоречия между боярством и служилым сословием.", "eff": {"k": -2, "v": -1, "z": 0, "n": -2}, "page": 4}, {"year": "1547", "title": "Новый титул", "situation": "Волнения подталкивают к мысли об укреплении власти государя. Кто предложил венчать Ивана на царство?", "options": ["Митрополит Макарий", "Протопоп Сильвестр", "Боярин Андрей Шуйский"], "answer": 0, "ex": "16 января 1547 г. митрополит Макарий венчал Ивана IV на царство в Успенском соборе. Россия стала царством — это развивало идею «Москва — Третий Рим».", "eff": {"k": 0, "v": 0, "z": 0, "n": 1}, "page": 4}, {"year": "1547", "title": "Почему «царь»?", "situation": "Зачем великому князю понадобился титул «царь»?", "options": ["Его потребовала Боярская дума в обмен на поддержку", "Так требовал польский король для заключения мира", "Титул ставил государя вровень с императорами и ханами Орды и подчёркивал наследие Византии"], "answer": 2, "ex": "Царями на Руси называли ордынских ханов, а слово «царь» происходит от «цезарь». В Европе титул переводили как «император» — выше короля. Князей много, а царь один: титул подчёркивал единовластие.", "eff": {"k": 0, "v": 0, "z": -1, "n": 1}, "page": 5}, {"year": "1547", "title": "Царская свадьба", "situation": "В феврале 1547 г. царь женился. Кто стал его женой?", "options": ["Мария Темрюковна", "Анастасия Романовна Захарьина-Юрьева", "Мария Нагая"], "answer": 1, "ex": "Женой царя стала Анастасия Романовна Захарьина-Юрьева. Мария Темрюковна станет женой Ивана в 1561 г., Мария Нагая — его последняя, седьмая жена.", "eff": {"k": 0, "v": 0, "z": 1, "n": 0}, "page": 4}, {"year": "июнь 1547", "title": "Москва в огне", "situation": "В июне 1547 г. выгорела треть Москвы. Пошли слухи, что пожар устроили колдовством. Кого обвинили в бедствии?", "options": ["Бабку царя Анну Глинскую и князей Глинских", "Митрополита Макария", "Шуйских"], "answer": 0, "ex": "Анну Глинскую обвинили в колдовстве, Юрия Глинского забили камнями, дворы Глинских разгромили. Протопоп Сильвестр убеждал царя взять власть в свои руки. Бунт утих, а царь понял, что нужны реформы.", "eff": {"k": -1, "v": 0, "z": -1, "n": -1}, "page": 5}], "fate": {"title": "1547 г. Конец боярского правления", "text": "Иван IV венчан на царство, женат и готов править сам, хотя пока не изменил прежним привычкам. Годы сиротства научили его жестокости и подозрительности — это ещё скажется на судьбе страны.", "plus": ["Пришло осознание необходимости реформ", "Венчание на царство укрепило власть и авторитет государя"], "minus": ["Ослабла центральная власть, расхищалась казна", "Ухудшилось положение народа, начались волнения", "Сформировались жестокость, подозрительность и мстительность царя"]}}, {"id": "rada", "title": "Время реформ", "ruler": "Иван IV и Избранная рада", "years": "1549–1560", "icon": "📜", "intro": "Рядом с царём — Избранная рада: Сильвестр, Адашев, Курбский, Макарий. Впереди реформы и большие походы на восток. Посмотрим, как ты справишься с ролью советника.", "notes": ["Избранная рада — неофициальное правительство конца 1540-х — 1550-х гг.: Сильвестр, А. Ф. Адашев, А. М. Курбский, М. И. Воротынский, И. М. Висковатый, митрополит Макарий.", "1549 г. — первый Земский собор («Собор примирения»): Боярская дума, высшее духовенство, выборные от служилых людей.", "1550 г. — Судебник: ограничена власть наместников, подтверждён Юрьев день, увеличено пожилое. 1551 г. — Стоглавый собор.", "1550 г. — стрелецкое войско; 1556 г. — Уложение о службе; отмена кормлений, власть на местах у губных и земских старост.", "1552 г. — взятие Казани: Свияжск, «гуляй-город», подкопы, штурм 2 октября. В честь победы — собор Покрова на Рву (Барма и Постник).", "1556 г. — Астраханское ханство навсегда вошло в состав России."], "decisions": [{"year": "1549", "title": "Собор примирения", "situation": "Царь хочет примирить сословия и обсудить новые законы. Какое учреждение созывается впервые?", "options": ["Земский собор", "Сенат", "Опричная дума"], "answer": 0, "ex": "Первый Земский собор 1549 г. называли «Собором примирения». В него вошли члены Боярской думы, высшее духовенство и выборные от служилых людей; собор одобрил составление нового законодательства.", "eff": {"k": 0, "v": 0, "z": 1, "n": 1}, "page": 6}, {"year": "1550", "title": "Новый Судебник", "situation": "Какие изменения внёс Судебник 1550 г., составленный при участии А. Адашева?", "options": ["Отменил Юрьев день и ввёл заповедные лета", "Ограничил власть наместников, подтвердил Юрьев день, но увеличил пожилое", "Отменил местничество"], "answer": 1, "ex": "Судебник 1550 г. ввёл наказания за произвол и взятки, ограничил власть наместников (суд вместе с выборными старостами и целовальниками), подтвердил Юрьев день, но увеличил пожилое.", "eff": {"k": 1, "v": 0, "z": 0, "n": 1}, "page": 7}, {"year": "1550", "title": "Войско с пищалями", "situation": "В Европе идёт «пороховая революция». Какое постоянное войско с огнестрельным оружием создаётся в России?", "options": ["Полки нового строя", "Рекрутские полки", "Стрелецкое войско"], "answer": 2, "ex": "В 1550 г. создано полурегулярное стрелецкое войско. Стрельцы в мирное время несли полицейскую службу и занимались ремеслом и торговлей; ими ведал Стрелецкий приказ.", "eff": {"k": -1, "v": 2, "z": 0, "n": 0}, "page": 9}, {"year": "1556", "title": "Конец кормлений", "situation": "Наместники-кормленщики разоряют уезды. Что решает правительство в 1556 г.?", "options": ["Отменить кормления и передать власть губным и земским старостам", "Назначить кормленщиков пожизненно", "Передать уезды под управление монастырей"], "answer": 0, "ex": "В 1556 г. кормления отменили, власть на местах перешла к губным и земским старостам. Собирался «кормленичий откуп». В том же году издано Уложение о службе: служить «конно, людно и оружно».", "eff": {"k": 1, "v": 1, "z": -1, "n": 1}, "page": 7}, {"year": "1552", "title": "Под стенами Казани", "situation": "Прежние походы на Казань не удались из-за отдалённости. Что помогло взять город в 1552 г.?", "options": ["Подкуп хана Едигера", "Крепость Свияжск, «гуляй-город», подкопы и подрывы, штурм 2 октября", "Помощь крымского хана"], "answer": 1, "ex": "Свияжск построили за 28 дней. У Казани действовал «гуляй-город», стены подрывали подкопами, 2 октября 1552 г. начался решающий штурм. Хан Едигер сдался, Казанское ханство вошло в состав России.", "eff": {"k": 1, "v": 1, "z": 1, "n": 0}, "page": 11}, {"year": "1556", "title": "Измена в Астрахани", "situation": "Хан-ставленник Москвы Дервиш-Али заключил союз с Крымом и выгнал русского представителя. Как поступила Москва?", "options": ["Заключила мир и выплатила хану дань", "Отправила стрельцов; Астраханское ханство навсегда вошло в состав России", "Передала Астрахань Ногайской Орде"], "answer": 1, "ex": "На Астрахань послали стрельцов, Дервиш-Али бежал, и в 1556 г. ханство навсегда вошло в состав России. Под контролем Москвы оказался весь Волжский торговый путь.", "eff": {"k": 2, "v": 0, "z": 0, "n": 1}, "page": 12}], "fate": {"title": "1560 г. Разлад с Избранной радой", "text": "После болезни 1553 г. царь стал подозрительнее. В 1560 г. умерла Анастасия Романовна — Иван уверен, что её отравили. Адашев сослан в Ливонию, Сильвестр — в Соловецкий монастырь. Время реформ закончилось.", "plus": ["Укреплена и централизована власть: приказы, Земский собор", "Создано стрелецкое войско, ограничено местничество", "Присоединены Казань и Астрахань, весь Волжский путь"], "minus": ["Судебник увеличил пожилое — закрепощение крестьян продолжилось", "Крым потерял союзников, отношения с ним обострились"]}}, {"id": "oprichnina", "title": "Грозный царь", "ruler": "Ливонская война и опричнина", "years": "1558–1572", "icon": "🐺", "intro": "Царь начинает войну за Балтику и ищет изменников повсюду. Это самая мрачная глава. Помоги восстановить, как одно решение вело к другому.", "notes": ["1558 г. — начало Ливонской войны: выход к Балтике (Нарва, Рига, Ревель); повод — неуплата «юрьевской дани». Избранная рада была за восточный курс.", "1564 г. — бегство А. Курбского в Литву; декабрь 1564 г. — отъезд царя в Александровскую слободу.", "1565 г. — страна поделена на опричнину и земщину. Столица опричнины — Александровская слобода.", "1569 г. — гибель Владимира Старицкого; митрополит Филипп Колычев убит Малютой Скуратовым.", "1570 г. — опричный поход на Новгород по ложному доносу.", "1571 г. — Девлет-Гирей сжёг Москву; 1572 г. — победа при Молодях (М. И. Воротынский), осенью опричнина отменена."], "decisions": [{"year": "1558", "title": "Куда идти войной?", "situation": "Избранная рада советует продолжать борьбу на востоке и юге, страна воюет с 1545 г. Как поступает царь?", "options": ["Начинает войну с Ливонским орденом за выход к Балтике", "Заключает вечный мир со всеми соседями", "Идёт походом на Крым"], "answer": 0, "ex": "В 1558 г. началась Ливонская война. Цель — Нарва, Рига, Ревель и выход к Балтийскому морю; повод — орден 50 лет не платил «юрьевскую дань». За май–октябрь 1558 г. взято 20 крепостей.", "eff": {"k": -1, "v": 1, "z": 0, "n": -1}, "page": 13}, {"year": "1564–1565", "title": "Царь покидает Москву", "situation": "Неудачи в войне, бегство Курбского в Литву. Царь уезжает в Александровскую слободу и пишет, что оставляет престол из-за измены. Чем всё закончилось?", "options": ["Царь отрёкся, и Земский собор избрал нового государя", "Царь вернулся, но страна поделена на опричнину и земщину", "Царь вернулся и простил бояр"], "answer": 1, "ex": "Народ потребовал вернуть царя, и Иван согласился — при условии, что страна будет поделена на опричнину и земщину (1565 г.). Земщина платила огромные налоги в пользу опричнины.", "eff": {"k": -2, "v": 0, "z": -2, "n": -1}, "page": 17}, {"year": "1568–1569", "title": "Голос митрополита", "situation": "Митрополит Филипп Колычев требует «соединить всю землю воедино» и осуждает опричнину. Какова его судьба?", "options": ["Царь отменил опричнину по его просьбе", "Филиппа сослали в Отроч монастырь, где его убил Малюта Скуратов", "Филипп стал первым патриархом"], "answer": 1, "ex": "Филиппа по доносу заточили в тверской Отроч монастырь; в 1569 г. его убил Малюта Скуратов. В тот же год Владимира Старицкого с женой и дочерью заставили выпить яд.", "eff": {"k": 0, "v": 0, "z": -1, "n": -1}, "page": 18}, {"year": "1570", "title": "Поход на Новгород", "situation": "Царю донесли, что Новгород хочет перейти к Литве и посадить на престол Владимира Старицкого. Что последовало?", "options": ["Новгород получил особые вольности", "Опричный поход: 40 дней разгрома, тысячи погибших, конец новгородской вольности", "Новгород отошёл к Литве"], "answer": 1, "ex": "Донос был ложным. Опричники 40 дней громили город, погибли от 4 до 10 тыс. человек, начался голод. Новгородская вольность была уничтожена навсегда.", "eff": {"k": -1, "v": 0, "z": -1, "n": -2}, "page": 19}, {"year": "1571–1572", "title": "Крымская угроза", "situation": "В 1571 г. Девлет-Гирей сжёг Москву — опричное войско не смогло его остановить. В 1572 г. хан снова идёт на Русь. Как удалось его разбить?", "options": ["Единым войском под командованием М. И.   const m=solved?meters(ci,j+1):before;
  shell(layout(ci,`<span class="eyebrow">Решение ${j+1} из ${c.decisions.length} · ${esc(d.year)}</span><h2>${esc(d.title)}</h2><p class="lead">${esc(d.situation)}</p>
  <div class="options">${d.options.map((o,i)=>`<button class="option ${sel===i?'selected':''} ${solved&&i===d.answer?'right':''}" data-o="${i}" ${solved?'disabled':''}><span class="letter">${'АБВ'[i]}</span>${esc(o)}</button>`).join('')}</div>
  ${fb}
  <div class="actions">${solved?`<button class="btn" id="next">${j+1<c.decisions.length?'Следующее решение →':'Узнать судьбу правителя →'}</button>`:`<button class="btn" id="check" ${sel===null?'disabled':''}>Скрепить печатью</button><button class="quiet" id="hint">Подсказка</button>`}</div>`,meterHTML(m,solved?before:null)));
  bindNav();
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sel=+b.dataset.o;fb='';render()});
  if($('#hint'))$('#hint').onclick=()=>{fb=`<div class="hint"><b>Подсказка советника</b><br>Перечитай донесения этой главы в свитке. <span class="source">Страница PDF скрипта: ${d.page}</span></div>`;render()};
  if($('#check'))$('#check').onclick=check;
  if($('#next'))$('#next').onclick=()=>{S.progress[ci]=j+1;save();j+1<c.decisions.length?decision(ci):fate(ci)};
 }
 function check(){
  if(sel===d.answer){solved=true;fb=`<div class="feedback"><strong>Так и было!</strong><p>${esc(d.ex)}</p><span class="source">Страница PDF: ${d.page}</span></div>`;announce('Верно. '+d.ex);render()}
  else{S.lives--;S.mistakes++;save();
   if(S.lives<=0){return gameover()}
   fb=`<div class="feedback bad"><strong>История пошла бы иначе…</strong><p>Так не было. Подумай ещё раз — донесения в свитке помогут. Потеряна 1 жизнь, осталось ${S.lives} из 5.</p></div>`;sel=null;announce('Неверно. Осталось жизней: '+S.lives);render()}
 }
 render();
}

function fate(ci){const c=DATA.chapters[ci];const f=c.fate;const first=!S.fates[ci];S.fates[ci]=true;save();
 shell(layout(ci,`<div class="complete"><div class="stamp">СУДЬБА<br>РАСКРЫТА</div><span class="eyebrow">Летописная карта</span><h2>${esc(f.title)}</h2><p>${esc(f.text)}</p></div>
 <h3>Каким стало государство</h3>${meterHTML(meters(ci,c.decisions.length))}
 <div class="book"><div class="book-card"><strong>Что удалось</strong>${f.plus.map(x=>'✦ '+esc(x)).join('<br>')}</div><div class="book-card minus"><strong>Чем пришлось заплатить</strong>${f.minus.map(x=>'✦ '+esc(x)).join('<br>')}</div></div>
 <div class="actions" style="justify-content:center">${ci+1<N?`<button class="btn" id="nextch">Следующая глава →</button>`:`<button class="btn" id="tofinal">К летописи века →</button>`}<button class="quiet" id="home2">Тронный зал</button></div>`));
 bindNav();$('#home2').onclick=home;
 if($('#nextch'))$('#nextch').onclick=()=>chapter(ci+1);
 if($('#tofinal'))$('#tofinal').onclick=final;
 if(first)toast('Печать получена: '+c.title);
}

/* ---------- final ---------- */
function finalShell(inner){return `<div class="game-nav"><button class="quiet" id="back">← Тронный зал</button><span class="navright">${hearts()} <button class="quiet" id="bag">Свиток</button></span></div>
 <div class="quest wide">${inner}</div>${foot()}`}
function final(){
 if(sealCount()<N)return home();
 if(!S.final.order)return fOrder();
 if(!S.final.sort)return fSort();
 if(!S.final.match)return fMatch();
 ending();
}
function lose(){S.lives--;S.mistakes++;save();if(S.lives<=0){gameover();return true}return false}
function fOrder(){const t=DATA.final.order;let pool=shuffle(t.items.map((_,i)=>i));if(pool.every((v,i)=>v===i))pool.reverse();let seq=[],fb='';
 function r(){shell(finalShell(`<span class="eyebrow">Летопись века · 1 / 3 · Восстанови порядок</span><h2>${t.title}</h2><p class="lead">${t.story}</p>
  <div class="orderbox">${seq.length?seq.map(i=>`<div class="orderitem"><span>${esc(t.items[i])}</span><button data-rm="${i}" aria-label="Убрать">✕</button></div>`).join(''):'<div class="empty">Твой порядок появится здесь ↓</div>'}</div>
  <div class="options">${pool.filter(i=>!seq.includes(i)).map(i=>`<button class="option" data-add="${i}">${esc(t.items[i])}</button>`).join('')}</div>${fb}
  <div class="actions"><button class="btn" id="check" ${seq.length<t.items.length?'disabled':''}>Скрепить печатью</button></div>`));bindNav();
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{seq.push(+b.dataset.add);fb='';r()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{seq=seq.filter(x=>x!==+b.dataset.rm);r()});
  $('#check').onclick=()=>{if(seq.every((v,i)=>v===i)){S.final.order=true;save();shell(finalShell(`<div class="feedback"><strong>Верно!</strong><p>${t.ex}</p></div><div class="actions"><button class="btn" id="n">Дальше →</button></div>`));bindNav();$('#n').onclick=final}
   else{if(lose())return;seq=[];fb=`<div class="feedback bad"><strong>Порядок нарушен</strong><p>Вспомни годы событий. Потеряна 1 жизнь, осталось ${S.lives} из 5.</p></div>`;r()}};
 }r()}
function fSort(){const t=DATA.final.sort;const order=shuffle(t.items.map((_,i)=>i));let pick={},fb='';
 function r(){shell(finalShell(`<span class="eyebrow">Летопись века · 2 / 3 · Взвесь итоги</span><h2>${t.title}</h2><p class="lead">${t.story}</p>
  <div class="sortlist">${order.map(i=>`<div class="sortrow ${pick[i]===1?'p':pick[i]===0?'m':''}"><span>${esc(t.items[i][0])}</span><span class="sbtn"><button data-s="${i}" data-v="1" class="${pick[i]===1?'on':''}">Плюс</button><button data-s="${i}" data-v="0" class="${pick[i]===0?'on':''}">Минус</button></span></div>`).join('')}</div>${fb}
  <div class="actions"><button class="btn" id="check" ${Object.keys(pick).length<t.items.length?'disabled':''}>Скрепить печатью</button></div>`));bindNav();
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pick[+b.dataset.s]=+b.dataset.v;fb='';r()});
  $('#check').onclick=()=>{const wrong=t.items.map((x,i)=>i).filter(i=>pick[i]!==t.items[i][1]);
   if(!wrong.length){S.final.sort=true;save();shell(finalShell(`<div class="feedback"><strong>Верно!</strong><p>${t.ex}</p></div><div class="actions"><button class="btn" id="n">Дальше →</button></div>`));bindNav();$('#n').onclick=final}
   else{if(lose())return;wrong.forEach(i=>delete pick[i]);fb=`<div class="feedback bad"><strong>Есть ошибки: ${wrong.length}</strong><p>Верные ответы сохранены, неверные сброшены. Потеряна 1 жизнь, осталось ${S.lives} из 5.</p></div>`;r()}};
 }r()}
function fMatch(){const t=DATA.final.match;const right=shuffle(t.pairs.map((_,i)=>i));let left=null,pairs={},fb='';
 function r(){shell(finalShell(`<span class="eyebrow">Летопись века · 3 / 3 · Соедини сведения</span><h2>${t.title}</h2><p class="lead">${t.story}</p>
  <div class="pairs"><div class="paircol">${t.pairs.map((p,i)=>`<button class="pairbtn ${left===i?'chosen':''} ${pairs[i]!==undefined?'paired':''}" data-l="${i}">${esc(p[0])}${pairs[i]!==undefined?' · '+esc(t.pairs[pairs[i]][1]):''}</button>`).join('')}</div>
  <div class="paircol">${right.map(i=>`<button class="pairbtn ${Object.values(pairs).includes(i)?'paired':''}" data-r="${i}">${esc(t.pairs[i][1])}</button>`).join('')}</div></div>
  <div class="pair-status">${left!==null?'Теперь выбери значение справа.':Object.keys(pairs).length===t.pairs.length?'Все пары собраны.':'Нажми понятие слева, затем его значение справа.'}</div>${fb}
  <div class="actions"><button class="btn" id="check" ${Object.keys(pairs).length<t.pairs.length?'disabled':''}>Скрепить печатью</button></div>`));bindNav();
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{left=+b.dataset.l;delete pairs[left];fb='';r()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(left===null){toast('Сначала выбери понятие слева');return}const v=+b.dataset.r;for(const k in pairs)if(pairs[k]===v)delete pairs[k];pairs[left]=v;left=null;r()});
  $('#check').onclick=()=>{const wrong=Object.keys(pairs).filter(k=>+k!==pairs[k]);
   if(!wrong.length){S.final.match=true;save();ending()}
   else{if(lose())return;wrong.forEach(k=>delete pairs[k]);fb=`<div class="feedback bad"><strong>Есть ошибки: ${wrong.length}</strong><p>Верные пары сохранены. Потеряна 1 жизнь, осталось ${S.lives} из 5.</p></div>`;r()}};
 }r()}

function ending(){shell(finalShell(`<div class="complete"><div class="stamp">ХРАНИТЕЛЬ<br>ЛЕТОПИСИ</div><span class="eyebrow">Век раскрыт</span><h2>Пять судеб —<br>одна эпоха.</h2>
 <p>Ты прошёл путь от регентства Елены Глинской до конца династии Рюриковичей и принял 30 решений так, как они были приняты на самом деле.</p><div class="stars">✦ ✦ ✦</div>
 <div class="book">${[['1535','Денежная реформа Елены Глинской'],['1547','Венчание Ивана IV на царство'],['1549','Первый Земский собор'],['1552 / 1556','Присоединение Казани и Астрахани'],['1565–1572','Опричнина'],['1598','Смерть Фёдора Иоанновича, конец Рюриковичей']].map(([a,b])=>`<div class="book-card"><strong>${a}</strong>${b}</div>`).join('')}</div>
 <p style="font-size:13px">Ошибок за путь: ${S.mistakes} · Жизней осталось: ${S.lives} из 5</p>
 <div class="actions"><button class="btn" id="print">Сохранить летопись в PDF / печать</button><button class="quiet" id="home2">Тронный зал</button></div></div>`));bindNav();
 $('#print').onclick=()=>window.print();$('#home2').onclick=home;}

function gameover(){const keep=S.mistakes;S=fresh();save();shell(`<div class="quest complete"><div class="stamp">ДВОР<br>РАСПУЩЕН</div><h2>Пять жизней закончились</h2><p>Советник слишком часто ошибался — придётся начинать службу заново. Донесения и подсказки помогут пройти путь увереннее.</p><div class="actions"><button class="btn" id="again">Начать путь заново →</button></div></div>${foot()}`);$('#again').onclick=home}

function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').showModal()}
function bag(){const open=DATA.chapters.filter((c,i)=>S.progress[i]>0||done(i)||unlocked(i));
 modal('Свиток советника',`<p class="smallnote">Здесь донесения открытых глав. Перечитывать можно бесплатно.</p><div class="bag-grid">${open.map(c=>`<div class="bag-card"><b>${c.ruler} · ${c.years}</b>${c.notes.map(esc).join('<br><br>')}</div>`).join('')}</div>`)}
function about(){modal('Об игре',`<p>«Судьба правителей» — учебная игра проекта «История и котики». Кот Квакс и его поручения вымышлены. Даты, личности и события взяты из скрипта «Иван Грозный» (тема 6).</p><br><p>В каждой главе ты принимаешь решения за государство. Правильный ответ — то, что произошло на самом деле. Шкалы «Казна», «Войско», «Знать» и «Народ» показывают последствия этих решений.</p><br><p>На весь путь даётся 5 жизней. Каждое неверное решение отнимает одну. Подсказки и свиток бесплатны.</p><br><p class="smallnote">Прогресс хранится только в этом браузере и никуда не отправляется.</p>`)}
function askReset(){modal('Начать с чистого листа?',`<p>Все печати и решения в этом браузере будут сброшены.</p><div class="actions"><button class="btn" id="yes">Да, начать заново</button></div>`);$('#yes').onclick=()=>{S=fresh();save();$('#modal').close();home()}}
$('#close-modal').onclick=()=>$('#modal').close();
$('#brand').onclick=e=>{e.preventDefault();home()};
home();

</script></body></html>
